      type: object
      required: [type, name, asset_sha256, size_bytes]
      properties:
        type:
          type: string
          const: file
        name:
          type: string
        parent_id:
          type: string
        asset_sha256:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        size_bytes:
          type: integer
          format: int64
          minimum: 0

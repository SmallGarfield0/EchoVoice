    ChannelFileEntry:
      type: object
      required: [entry_id, channel_id, type, name, owner_member_id, size_bytes, created_at_ms, updated_at_ms]
      properties:
        entry_id:
          type: string
        channel_id:
          type: string
        parent_id:
          type: string
        type:
          type: string
          enum: [directory, file]
        name:
          type: string

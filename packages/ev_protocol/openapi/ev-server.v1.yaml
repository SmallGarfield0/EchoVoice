          pattern: "^[a-f0-9]{64}$"
        owner_member_id:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        mime_type:
          type: string
        created_at_ms:
          type: integer
          format: int64
        updated_at_ms:
          type: integer
          format: int64
    ChannelDirectoryCreate:
